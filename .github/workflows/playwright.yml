name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        # --grep-invert @visual: screenshot baselines are win32-only, and font
        # rendering on the Linux runner would diff on every pixel. See the
        # visual-baselines job below for how Linux baselines get produced.
        run: npx playwright test --grep-invert @visual --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          # CI reporter is 'blob' (see playwright.config.ts) so each shard can be
          # merged back into a single report below.
          path: blob-report/
          retention-days: 1

  merge-reports:
    name: Merge shard reports
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for the Firestore stats step
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blobs
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports ./all-blobs --reporter=html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Authenticate to portfolio Firestore
        # Keyless: GitHub OIDC -> Workload Identity Federation. Only pushes to
        # main in NNEWNERR repos can mint this token.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/932862873750/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: ci-stats-writer@supakorn-portfolio.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
      - name: Publish test stats to nnewnerr.github.io
        # Runs on red builds too — the portfolio shows the latest result, not
        # the latest green one. Never fails the build on its own.
        if: always() && steps.gcp.outcome == 'success'
        continue-on-error: true
        env:
          FIRESTORE_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: node scripts/publish-test-stats.mjs --suite qa-automation --repo qa-automation --label "Playwright · 8 projects" --kind playwright --file results.json

  visual-baselines:
    name: Generate Linux visual baselines (manual)
    # Opt-in only. Runs the visual suite inside the official Playwright image so
    # rendering matches the CI runner, and uploads the generated snapshots to be
    # committed as the linux baseline set. Never auto-runs: self-generating
    # baselines on every push would make visual regression meaningless.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      # Keep this tag in sync with @playwright/test in package.json — a version
      # mismatch between the image and the runner silently changes rendering,
      # which is exactly what these baselines are meant to detect.
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npx playwright test --project=visual-tests --update-snapshots
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        with:
          name: linux-snapshots
          path: tests/**/*-snapshots/**
          retention-days: 7
